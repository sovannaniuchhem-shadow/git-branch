<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Design</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3"
             alt="Laptop">

        <div class="card-content">
            <h2>Web Development</h2>

            <p>
                Learn HTML, CSS, and JavaScript to build modern websites.
            </p>

            <button onclick="showMore()">Learn More</button>

            <div id="more" class="more-info">
                <p>
                    HTML creates the structure, CSS designs the website,
                    and JavaScript adds interaction.
                </p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
